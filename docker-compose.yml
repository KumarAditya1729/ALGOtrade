x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    BASE_IMAGE: python:3.12-slim-bookworm

x-backend-runtime: &backend-runtime
  init: true
  security_opt:
    - no-new-privileges:true

x-worker-environment: &worker-environment
  TZ: Asia/Shanghai
  DATABASE_URL: postgresql://${POSTGRES_USER:-calculatedrisk}:${POSTGRES_PASSWORD:-calculatedrisk123}@postgres:5432/${POSTGRES_DB:-calculatedrisk}
  DB_TYPE: postgresql
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  CACHE_ENABLED: "true"
  CELERY_TASKS_ENABLED: "true"
  CELERY_REDIS_HOST: redis-jobs
  CELERY_REDIS_PORT: 6379
  CELERY_BROKER_DB: 0
  CELERY_RESULT_DB: 1
  DB_POOL_MIN: 2
  DB_POOL_MAX: 12

services:
  postgres:
    image: postgres:18.3-alpine
    container_name: calculatedrisk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calculatedrisk}
      POSTGRES_USER: ${POSTGRES_USER:-calculatedrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calculatedrisk123}
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calculatedrisk} -d ${POSTGRES_DB:-calculatedrisk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: calculatedrisk-redis
    restart: unless-stopped
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-jobs:
    image: redis:8-alpine
    container_name: calculatedrisk-redis-jobs
    restart: unless-stopped
    volumes:
      - celery_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    <<: *backend-runtime
    build: *backend-build
    container_name: calculatedrisk-migration
    restart: "no"
    command: ["python", "-m", "app.commands.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/.env:/app/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-calculatedrisk}:${POSTGRES_PASSWORD:-calculatedrisk123}@postgres:5432/${POSTGRES_DB:-calculatedrisk}
      DB_TYPE: postgresql

  backend:
    <<: *backend-runtime
    build: *backend-build
    container_name: calculatedrisk-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-jobs:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "5001:5000"
    volumes:
      - ./backend/.env:/app/.env
    environment:
      - PYTHON_API_HOST=0.0.0.0
      - PYTHON_API_PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-calculatedrisk}:${POSTGRES_PASSWORD:-calculatedrisk123}@postgres:5432/${POSTGRES_DB:-calculatedrisk}
      - DB_TYPE=postgresql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_TASKS_ENABLED=true
      - CELERY_REDIS_HOST=redis-jobs
      - CELERY_REDIS_PORT=6379
      - CELERY_BROKER_DB=0
      - CELERY_RESULT_DB=1
      - QD_PROCESS_ROLE=api
      - FRONTEND_URL=http://localhost:8888
      - SKIP_AUTO_MIGRATE=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    <<: *backend-runtime
    build: *backend-build
    container_name: calculatedrisk-celery-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "jobs,ai,maintenance"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-jobs:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - ./backend/.env:/app/.env
    environment:
      <<: *worker-environment
      QD_PROCESS_ROLE: celery

  celery-beat:
    <<: *backend-runtime
    build: *backend-build
    container_name: calculatedrisk-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/app/data/celerybeat-schedule"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-jobs:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - ./backend/.env:/app/.env
      - backend_data:/app/data
    environment:
      <<: *worker-environment
      QD_PROCESS_ROLE: celery

  websocket-proxy:
    <<: *backend-runtime
    build: *backend-build
    container_name: calculatedrisk-websocket-proxy
    restart: unless-stopped
    command: ["python", "-m", "app.services.websocket_proxy.server"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8765:8765"
    volumes:
      - ./backend/.env:/app/.env
    environment:
      <<: *worker-environment
      QD_PROCESS_ROLE: websocket
      WS_PORT: "8765"

  frontend:
    build:
      context: ./unified_frontend
      dockerfile: Dockerfile
    container_name: calculatedrisk-frontend
    restart: unless-stopped
    ports:
      - "8888:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  celery_redis_data:
    driver: local
  backend_data:
    driver: local
